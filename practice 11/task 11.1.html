<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Опрос пользователя</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
  .field { margin-bottom: 15px; }
  label { display: block; font-weight: bold; margin-bottom: 5px; }
  input[type="text"], input[type="email"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  .error { color: #c00; font-size: 13px; margin-top: 4px; }
  .invalid { border: 2px solid #c00; }
  .result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; background: #f9f9f9; }
  button { padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>

<h2>Опрос пользователя</h2>

<form id="surveyForm" novalidate>
  <div class="field">
    <label for="name">Имя пользователя *</label>
    <input type="text" id="name" name="name">
    <div class="error" id="nameError"></div>
  </div>

  <div class="field">
    <label for="email">Email *</label>
    <input type="email" id="email" name="email">
    <div class="error" id="emailError"></div>
  </div>

  <div class="field">
    <label>Пол</label>
    <label><input type="radio" name="gender" value="Мужской" checked> Мужской</label>
    <label><input type="radio" name="gender" value="Женский"> Женский</label>
  </div>

  <div class="field">
    <label for="rating">Оценка сервиса: <span id="ratingValue">5</span></label>
    <input type="range" id="rating" name="rating" min="1" max="10" value="5">
  </div>

  <div class="field">
    <label>Интересы пользователя</label>
    <label><input type="checkbox" name="interest" value="Спорт"> Спорт</label>
    <label><input type="checkbox" name="interest" value="Музыка"> Музыка</label>
    <label><input type="checkbox" name="interest" value="Путешествия"> Путешествия</label>
    <label><input type="checkbox" name="interest" value="Кино"> Кино</label>
  </div>

  <div class="field">
    <label for="comments">Дополнительные комментарии</label>
    <textarea id="comments" name="comments" rows="3"></textarea>
  </div>

  <button type="submit">Отправить</button>
</form>

<div class="result" id="result" style="display:none;"></div>

<script>
  const form = document.getElementById('surveyForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const nameError = document.getElementById('nameError');
  const emailError = document.getElementById('emailError');
  const rating = document.getElementById('rating');
  const ratingValue = document.getElementById('ratingValue');
  const result = document.getElementById('result');

  // Живое обновление значения ползунка
  rating.addEventListener('input', () => { ratingValue.textContent = rating.value; });

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function validateName() {
    const value = nameInput.value.trim();
    if (!value) {
      nameError.textContent = 'Имя обязательно для заполнения.';
      nameInput.classList.add('invalid');
      return false;
    }
    nameError.textContent = '';
    nameInput.classList.remove('invalid');
    return true;
  }

  function validateEmail() {
    const value = emailInput.value.trim();
    if (!value) {
      emailError.textContent = 'Email обязателен для заполнения.';
      emailInput.classList.add('invalid');
      return false;
    }
    if (!emailRegex.test(value)) {
      emailError.textContent = 'Введите корректный email (например, user@mail.ru).';
      emailInput.classList.add('invalid');
      return false;
    }
    emailError.textContent = '';
    emailInput.classList.remove('invalid');
    return true;
  }

  // Валидация в момент ввода
  nameInput.addEventListener('input', validateName);
  emailInput.addEventListener('input', validateEmail);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const okName = validateName();
    const okEmail = validateEmail();
    if (!okName || !okEmail) return;

    const gender = document.querySelector('input[name="gender"]:checked').value;
    const interests = [...document.querySelectorAll('input[name="interest"]:checked')]
      .map(i => i.value);
    const comments = document.getElementById('comments').value.trim();

    result.style.display = 'block';
    result.innerHTML = `
      <h3>Данные пользователя</h3>
      <p><strong>Имя:</strong> ${escapeHtml(nameInput.value.trim())}</p>
      <p><strong>Email:</strong> ${escapeHtml(emailInput.value.trim())}</p>
      <p><strong>Пол:</strong> ${gender}</p>
      <p><strong>Оценка сервиса:</strong> ${rating.value} / 10</p>
      <p><strong>Интересы:</strong> ${interests.length ? interests.join(', ') : 'не выбраны'}</p>
      <p><strong>Комментарии:</strong> ${comments ? escapeHtml(comments) : '—'}</p>
    `;
  });

  // Простая защита от вставки HTML
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }
</script>

</body>
</html>
