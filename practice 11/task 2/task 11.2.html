<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор доставки</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>

<h2>Калькулятор стоимости доставки</h2>

<form class="product-form" novalidate>
  <div class="field">
    <label for="productName">Название товара:</label>
    <input type="text" id="productName" name="productName" class="p-name">
    <div class="error name-error"></div>
  </div>
  <div class="field">
    <label for="productWeight">Вес товара (кг):</label>
    <input type="number" id="productWeight" name="productWeight" step="0.01" min="0.01" class="p-weight">
    <div class="error weight-error"></div>
  </div>
  <div class="field">
    <label for="productDistance">Расстояние (км):</label>
    <input type="number" id="productDistance" name="productDistance" step="0.01" min="0.01" class="p-distance">
    <div class="error distance-error"></div>
  </div>
  <button type="submit">Добавить товар</button>
</form>

<table class="product-table">
  <thead>
    <tr>
      <th>Название товара</th>
      <th>Вес (кг)</th>
      <th>Расстояние (км)</th>
      <th>Стоимость доставки</th>
    </tr>
  </thead>
  <tbody>
    <!-- Здесь будут добавляться товары -->
  </tbody>
</table>

<script src="script2.js"></script>
</body>
</html>
