<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Настройка банковской карты</title>
  <link rel="stylesheet" href="style3.css">
</head>
<body>

<h2>Настройте свою банковскую карту</h2>

<div class="field">
  <label for="cardText">Текст на карте:</label>
  <input type="text" id="cardText" class="card-text-input" placeholder="Введите текст...">
</div>

<div class="field">
  <label for="colorSelect">Цвет карты:</label>
  <select id="colorSelect" class="color-select">
    <option value="">— выберите цвет —</option>
    <option value="red">Красный</option>
    <option value="blue">Синий</option>
    <option value="green">Зелёный</option>
  </select>
</div>

<p class="card-display">Ваша карта</p>

<script src="script3.js"></script>
</body>
</html>
