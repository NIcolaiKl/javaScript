<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор доставки</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 20px auto;
  }
  form { margin-bottom: 20px; }
  .field { margin-bottom: 10px; }
  label { display: inline-block; min-width: 180px; font-weight: bold; }
  input { padding: 6px; }
  .error { color: #c00; font-size: 13px; }
  .invalid { border: 2px solid #c00; }
  button { padding: 8px 18px; cursor: pointer; }

  table {
    border-collapse: collapse;
    width: 100%;
  }
  table, th, td {
    border: 1px solid #ccc;
  }
  th, td {
    padding: 10px;
    text-align: left;
  }
  thead { background: #f0f0f0; }
</style>
</head>
<body>

<h2>Калькулятор стоимости доставки</h2>

<form id="productForm" novalidate>
  <div class="field">
    <label for="productName">Название товара:</label>
    <input type="text" id="productName">
    <div class="error" id="nameError"></div>
  </div>
  <div class="field">
    <label for="productWeight">Вес товара (кг):</label>
    <input type="number" id="productWeight" step="0.01" min="0.01">
    <div class="error" id="weightError"></div>
  </div>
  <div class="field">
    <label for="productDistance">Расстояние (км):</label>
    <input type="number" id="productDistance" step="0.01" min="0.01">
    <div class="error" id="distanceError"></div>
  </div>
  <button type="submit">Добавить товар</button>
</form>

<table class="product-table">
  <thead>
    <tr>
      <th>Название товара</th>
      <th>Вес (кг)</th>
      <th>Расстояние (км)</th>
      <th>Стоимость доставки</th>
    </tr>
  </thead>
  <tbody>
    <!-- Здесь будут добавляться товары -->
  </tbody>
</table>

<script>
  const form = document.getElementById('productForm');
  const nameInput = document.getElementById('productName');
  const weightInput = document.getElementById('productWeight');
  const distanceInput = document.getElementById('productDistance');
  const nameError = document.getElementById('nameError');
  const weightError = document.getElementById('weightError');
  const distanceError = document.getElementById('distanceError');
  const tbody = document.querySelector('.product-table tbody');

  const nameRegex = /^[A-Za-zА-Яа-яЁё0-9\s\-]{2,}$/;

  function validate() {
    let ok = true;

    // Название: минимум 2 символа, буквы/цифры/пробел/дефис
    const name = nameInput.value.trim();
    if (!nameRegex.test(name)) {
      nameError.textContent = 'Введите корректное название (мин. 2 символа).';
      nameInput.classList.add('invalid');
      ok = false;
    } else {
      nameError.textContent = '';
      nameInput.classList.remove('invalid');
    }

    // Вес: положительное число
    const weight = parseFloat(weightInput.value);
    if (isNaN(weight) || weight <= 0) {
      weightError.textContent = 'Вес должен быть положительным числом.';
      weightInput.classList.add('invalid');
      ok = false;
    } else {
      weightError.textContent = '';
      weightInput.classList.remove('invalid');
    }

    // Расстояние: положительное число
    const distance = parseFloat(distanceInput.value);
    if (isNaN(distance) || distance <= 0) {
      distanceError.textContent = 'Расстояние должно быть положительным числом.';
      distanceInput.classList.add('invalid');
      ok = false;
    } else {
      distanceError.textContent = '';
      distanceInput.classList.remove('invalid');
    }

    return ok;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!validate()) return;

    const name = nameInput.value.trim();
    const weight = parseFloat(weightInput.value);
    const distance = parseFloat(distanceInput.value);
    const cost = (weight * distance) / 10;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(name)}</td>
      <td>${weight}</td>
      <td>${distance}</td>
      <td>${cost.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);

    // Очистка формы
    form.reset();
    [nameInput, weightInput, distanceInput].forEach(i => i.classList.remove('invalid'));
    [nameError, weightError, distanceError].forEach(e => e.textContent = '');
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }
</script>

</body>
</html>
