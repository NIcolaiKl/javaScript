<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекция фильмов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Коллекция фильмов</h1>

        <form id="film-form">
            <div class="form-group">
                <label for="title">Название</label>
                <input type="text" id="title" required placeholder="Например: Начало">
            </div>
            <div class="form-group">
                <label for="genre">Жанр</label>
                <input type="text" id="genre" required placeholder="Фантастика">
            </div>
            <div class="form-group">
                <label for="releaseYear">Год выпуска</label>
                <input type="number" id="releaseYear" required placeholder="2010" min="1888" max="2100">
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="isWatched">
                <label for="isWatched">Просмотрен</label>
            </div>
            <button type="submit">Добавить фильм</button>
        </form>

        <div class="toolbar">
            <label for="sort-select" class="sort-label">Сортировка:</label>
            <select id="sort-select" class="sort-select">
                <option value="none">Без сортировки</option>
                <option value="title-asc">Название (А–Я)</option>
                <option value="title-desc">Название (Я–А)</option>
                <option value="year-asc">Год (старые → новые)</option>
                <option value="year-desc">Год (новые → старые)</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Жанр</th>
                        <th>Год выпуска</th>
                        <th>Просмотрен</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody id="film-tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
