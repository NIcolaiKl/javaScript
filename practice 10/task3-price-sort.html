<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задача 3. Сортировка цен</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { border-bottom: 2px solid #eee; padding-bottom: 8px; }
    button {
      padding: 8px 16px; margin-right: 8px;
      cursor: pointer; font-size: 14px;
    }
    ul {
      margin-top: 16px; padding: 12px 12px 12px 32px;
      border: 1px solid #ddd; border-radius: 6px;
      background: #fafafa;
    }
    li { margin: 4px 0; font-size: 16px; }
  </style>
</head>
<body>

  <h1>Сортировка цен</h1>

  <button id="sort-asc">По возрастанию</button>
  <button id="sort-desc">По убыванию</button>

  <ul id="prices-list"></ul>

  <script>
    // IIFE создаёт замыкание: массив prices скрыт от внешнего кода
    (function initPriceSorter() {
      // Исходный массив цен
      let prices = [100, 500, 250, 750, 300];

      const list = document.getElementById('prices-list');
      const ascBtn = document.getElementById('sort-asc');
      const descBtn = document.getElementById('sort-desc');

      // Функция отображения цен на странице
      function render() {
        list.innerHTML = '';
        prices.forEach(function (price) {
          const li = document.createElement('li');
          li.textContent = price + ' ₽';
          list.appendChild(li);
        });
      }

      // Сортировка по возрастанию (на копии — не мутируем исходник)
      function sortAsc() {
        prices = [...prices].sort(function (a, b) { return a - b; });
        render();
      }

      // Сортировка по убыванию
      function sortDesc() {
        prices = [...prices].sort(function (a, b) { return b - a; });
        render();
      }

      // Обработчики кнопок
      ascBtn.addEventListener('click', sortAsc);
      descBtn.addEventListener('click', sortDesc);

      // Первый рендер при загрузке страницы
      render();
    })();
  </script>
</body>
</html>
