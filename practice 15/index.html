<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекция фильмов</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="container">
        <form id="film-form">
            <label for="title">Название:</label>
            <input type="text" id="title" name="title" required>
            
            <label for="genre">Жанр:</label>
            <input type="text" id="genre" name="genre" required>
            
            <label for="releaseYear">Год:</label>
            <input type="number" id="releaseYear" name="releaseYear" required min="1888" max="2100">
            
            <div class="checkbox-wrapper">
                <input type="checkbox" id="isWatched" name="isWatched">
                <label for="isWatched">Успели посмотреть?</label>
            </div>
            
            <button type="submit">Submit</button>
        </form>

        <div class="controls">
            <div class="filters">
                <input type="text" id="filter-title" placeholder="Название фильма">
                <input type="text" id="filter-genre" placeholder="Жанр">
                <input type="number" id="filter-year" placeholder="Год релиза">
                <select id="filter-watched">
                    <option value="">Все</option>
                    <option value="true">Просмотренные</option>
                    <option value="false">Непросмотренные</option>
                </select>
            </div>
            <button id="delete-all-btn" class="btn-danger">Удалить все</button>
        </div>

        <table id="film-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Жанр</th>
                    <th>Год</th>
                    <th>Успели посмотреть?</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="film-tbody">
                <!-- Строки добавляются через JS -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
